<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self';"
  />
  <title>Desktop Assistant Bot</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Left Sidebar Navigation -->
    <aside class="sidebar" aria-label="Primary Navigation">
      <div class="sidebar-brand">
        <div class="brand-logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="4 17 10 11 4 5"></polyline>
            <line x1="12" y1="19" x2="20" y2="19"></line>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Assistant Bot</span>
          <span class="brand-tag">Offline • Phase 1</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="nav-item active" data-nav-page="dashboard" aria-current="page">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>Dashboard</span>
        </button>

        <button type="button" class="nav-item" data-nav-page="launcher">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Quick Launcher</span>
        </button>

        <button type="button" class="nav-item" data-nav-page="settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-hotkey-card">
          <span class="sidebar-hotkey-label">Global Toggle</span>
          <kbd id="sidebar-hotkey-badge" class="kbd-shortcut">Ctrl + Shift + Space</kbd>
        </div>

        <div class="sidebar-tray-actions">
          <button type="button" id="sidebar-hide-btn" class="btn btn-ghost btn-sm" title="Hide window to Windows System Tray">
            Hide to Tray
          </button>
          <button type="button" id="sidebar-exit-btn" class="btn btn-danger-ghost btn-sm" title="Terminate application completely">
            Exit App
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="main-area">
      <header class="topbar">
        <div class="topbar-titles">
          <h1 id="page-title" class="page-title">Dashboard</h1>
          <p id="page-subtitle" class="page-subtitle">
            System status, quick actions, and Windows workstation controls
          </p>
        </div>

        <div class="topbar-actions">
          <button type="button" id="header-theme-toggle" class="btn btn-secondary btn-sm" title="Switch Dark / Light Mode">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <span id="header-theme-label">Dark Mode</span>
          </button>

          <button type="button" id="header-app-info-btn" class="btn btn-ghost btn-sm" title="View Application & System Details">
            App Info
          </button>
        </div>
      </header>

      <main class="content-scroll">
        <div id="page-dashboard" class="page-view"></div>
        <div id="page-launcher" class="page-view hidden"></div>
        <div id="page-settings" class="page-view hidden"></div>
      </main>
    </div>
  </div>

  <!-- Application Information Modal -->
  <div id="app-info-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="app-info-modal-title">
    <div class="modal-dialog card">
      <div class="modal-header">
        <h3 id="app-info-modal-title">Application & System Information</h3>
        <button type="button" id="app-info-modal-close" class="btn-icon" aria-label="Close modal">&times;</button>
      </div>
      <div id="app-info-modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="./renderer.js"></script>
</body>
</html>
